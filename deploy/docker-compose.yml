# Design Lab North — edge + studio site + plot sandbox
# Local: docker compose -f deploy/docker-compose.yml up --build
# VPS:   /srv/dln/repo/deploy

name: dln

services:
  edge:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDY_FILE:-./Caddyfile.ip}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
      - plot-modyu
      - plot-swarm
      - plot-titles

  # Answers DNS only while the registrar NS are the plot hosts.
  # Also needs IONOS Cloud Panel: allow 53/tcp and 53/udp. UFW alone is not enough.
  dns:
    image: coredns/coredns:1.11.3
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    ports:
      - "82.165.5.84:53:53/udp"
      - "82.165.5.84:53:53/tcp"
    volumes:
      - ./coredns:/etc/coredns:ro

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DLN_PUBLIC_URL: ${DLN_PUBLIC_URL:-http://localhost}
      DLN_COOKIE_DOMAIN: ${DLN_COOKIE_DOMAIN:-}
      DLN_COOKIE_SECURE: ${DLN_COOKIE_SECURE:-false}
      DLN_SMTP_HOST: ${DLN_SMTP_HOST:-}
      DLN_SMTP_PORT: ${DLN_SMTP_PORT:-587}
      DLN_SMTP_USER: ${DLN_SMTP_USER:-}
      DLN_SMTP_PASS: ${DLN_SMTP_PASS:-}
      DLN_ENQUIRE_TO: ${DLN_ENQUIRE_TO:-build@designlabnorth.com}
      DLN_ENQUIRE_FROM: ${DLN_ENQUIRE_FROM:-}
      TITLES_PUBLIC_URL: ${TITLES_PUBLIC_URL:-https://varioustitles.com}
      DLN_HOME_ORIGIN: ${DLN_HOME_ORIGIN:-http://host.docker.internal:13010}
      DLN_HOME_DIAL_SECRET: ${DLN_HOME_DIAL_SECRET:-}
      HOME_TICKET_PUB_FILE: ${HOME_TICKET_PUB_FILE:-/app/_meta/secrets/home-ticket.pub}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DLN_ACCOUNTS_DIR:-../_meta/accounts}:/app/_meta/accounts
      - ${DLN_BILLING_DIR:-../_meta/billing}:/app/_meta/billing
      - ${DLN_ENQUIRIES_DIR:-../_meta/enquiries}:/app/_meta/enquiries
      - ${DLN_PLANS_DIR:-../_meta/plans}:/app/_meta/plans
      - ${DLN_HOME_TICKET_PUB:-/srv/dln/data/home-ticket.pub}:/app/_meta/secrets/home-ticket.pub:ro
    expose:
      - "3000"

  plot-modyu:
    build:
      context: ${MODYU_DIR:-/srv/dln/plots/modyu}
      dockerfile: deploy/Dockerfile
      args:
        BASE_PATH: ${MODYU_BASE_PATH:-}
    restart: unless-stopped
    labels:
      dln.plot: modyu
    volumes:
      - ${MODYU_ACCOUNTS_DIR:-/srv/dln/data/modyu-accounts}:/app/_meta/accounts
      - ${MODYU_ORDERS_DIR:-/srv/dln/data/modyu-orders}:/app/_meta/orders
      - ${MODYU_ANALYTICS_DIR:-/srv/dln/data/modyu-analytics}:/app/_meta/analytics
    environment:
      MODYU_COOKIE_SECURE: ${MODYU_COOKIE_SECURE:-true}
      DLN_ORIGIN: ${MODYU_DLN_ORIGIN:-http://web:3000}
      DLN_PUBLIC_URL: ${DLN_PUBLIC_URL:-https://designlabnorth.com}
    expose:
      - "3000"

  plot-swarm:
    build:
      context: ${SWARM_DIR:-/srv/dln/plots/swarm}
      dockerfile: deploy/Dockerfile.greenhouse
      args:
        VITE_BASE: ${SWARM_BASE_PATH:-/}
        VITE_API_BASE: ${SWARM_API_BASE:-/api}
    restart: unless-stopped
    labels:
      dln.plot: swarm
    environment:
      CORS_ORIGIN: ${SWARM_CORS_ORIGIN:-https://swarmfund.com,https://www.swarmfund.com,https://swarmfund.designlabnorth.com}
      COOKIE_PATH: ${SWARM_COOKIE_PATH:-/}
      SWARMFUND_DB: /data/swarmfund.sqlite
      BUILDING_LOCK: ${SWARM_BUILDING_LOCK:-true}
      DLN_ORIGIN: ${SWARM_DLN_ORIGIN:-http://web:3000}
      DLN_PUBLIC_URL: ${DLN_PUBLIC_URL:-https://designlabnorth.com}
      SWARM_PUBLIC_URL: ${SWARM_PUBLIC_URL:-https://swarmfund.com}
      SF_COOKIE_SECURE: ${SWARM_COOKIE_SECURE:-true}
    volumes:
      - ${SWARM_DATA_DIR:-/srv/dln/data/swarm}:/data
    expose:
      - "3000"

  plot-titles:
    build:
      context: ${TITLES_DIR:-/srv/dln/plots/various-titles}
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    labels:
      dln.plot: various-titles
    environment:
      DLN_ORIGIN: ${TITLES_DLN_ORIGIN:-http://web:3000}
      DLN_PUBLIC_URL: ${DLN_PUBLIC_URL:-https://designlabnorth.com}
      VT_PUBLIC_URL: ${TITLES_PUBLIC_URL:-https://varioustitles.com}
      VT_COOKIE_DOMAIN: ${TITLES_COOKIE_DOMAIN:-}
      VT_COOKIE_SECURE: ${TITLES_COOKIE_SECURE:-true}
    expose:
      - "3000"

volumes:
  caddy_data:
  caddy_config:
