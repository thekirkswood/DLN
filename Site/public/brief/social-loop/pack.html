<!DOCTYPE html>
<html lang="en-GB" data-orient="landscape">
<head>
  <meta charset="utf-8" />
  <title>DLN loop — pack</title>
  <style>
    :root {
      --ground: #ffffff;
      --ink: #414141;
      --c1: #2c2c2c;
      --c2: #3d5c73;
      --c3: #8a5340;
      --font: "aktiv-grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font);
      height: 100%;
      overflow: hidden;
    }
    body { display: flex; align-items: center; justify-content: center; }
    .stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      padding: 4.2% 4.6% 3.6%;
      position: relative;
      overflow: hidden;
    }
    html[data-orient="portrait"] .stage {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      padding: 6.5% 8% 6%;
    }
    .board {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: 0.42fr 1.12fr 1fr;
      gap: 3%;
      align-items: stretch;
      will-change: transform;
    }
    html[data-orient="portrait"] .board {
      grid-template-columns: 1fr;
      grid-template-rows: 0.42fr 0.78fr 1.12fr;
    }

    .user {
      height: 100%;
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      align-items: center;
    }
    html[data-orient="portrait"] .user {
      grid-template-rows: 1fr;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .slot {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .hatch,
    .ghost {
      display: block;
      width: 78%;
      max-width: 6.4rem;
      background: repeating-linear-gradient(-45deg, var(--ink) 0 1.7px, transparent 1.7px 5.6px);
      -webkit-mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-size: 100% 100%;
      mask-repeat: no-repeat;
      mask-position: center;
    }
    .hatch-d, .ghost-d { aspect-ratio: 298 / 349; }
    .hatch-l, .ghost-l { aspect-ratio: 297 / 349; }
    .hatch-n, .ghost-n { aspect-ratio: 300 / 349; }
    html[data-orient="portrait"] .hatch { width: 72%; }
    .hatch-d, .ghost-d {
      -webkit-mask-image: url(/brief/social-loop/letters/d.png);
      mask-image: url(/brief/social-loop/letters/d.png);
    }
    .hatch-l, .ghost-l {
      -webkit-mask-image: url(/brief/social-loop/letters/l.png);
      mask-image: url(/brief/social-loop/letters/l.png);
    }
    .hatch-n, .ghost-n {
      -webkit-mask-image: url(/brief/social-loop/letters/n.png);
      mask-image: url(/brief/social-loop/letters/n.png);
    }

    .window {
      width: 94%;
      margin: auto;
      color: var(--ink);
      align-self: center;
      transform-origin: 50% 50%;
    }
    .lid { width: 100%; aspect-ratio: 16 / 10.6; display: block; overflow: visible; }
    .base {
      display: block;
      height: 0.78rem;
      background: var(--ink);
      clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%);
    }
    .guest { opacity: 0; }
    .mark { opacity: 0; }

    .ghost,
    .flyer {
      position: absolute;
      z-index: 6;
      pointer-events: none;
      overflow: visible;
      opacity: 0;
      left: 0;
      top: 0;
    }
    .ghost {
      max-width: none;
    }
    .flyer img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .outs {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      min-width: 0;
    }
    html[data-orient="portrait"] .outs {
      grid-template-rows: 1fr;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .cell {
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pack {
      width: auto;
      height: 86%;
      max-width: 78%;
      overflow: visible;
      color: var(--ink);
    }
    .pack .skin { fill: var(--c2); stroke: none; opacity: 0; }
    .pack-bottle .skin { fill: var(--c1); }
    .pack-tub .skin { fill: var(--c2); }
    .pack-sleeve .skin { fill: var(--c3); }
    .pack .stamp { opacity: 0; }

    html[data-freeze] .ghost,
    html[data-freeze] .flyer { display: none; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <aside class="user" aria-hidden>
        <div class="slot"><i class="hatch hatch-d"></i></div>
        <div class="slot"><i class="hatch hatch-l"></i></div>
        <div class="slot"><i class="hatch hatch-n"></i></div>
      </aside>

      <article class="window" id="window" aria-hidden>
        <svg class="lid" viewBox="0 0 320 214" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M14 0 H306 L320 14 V200 L306 214 H14 L0 200 V14 Z" />
          <path d="M0 28 H320" />
          <circle cx="16" cy="14" r="3.2" fill="currentColor" stroke="none" />
          <circle cx="28" cy="14" r="3.2" fill="currentColor" stroke="none" />
          <circle cx="40" cy="14" r="3.2" fill="currentColor" stroke="none" />
          <defs>
            <pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <path d="M0 0 H8" stroke="currentColor" stroke-width="2.2" />
            </pattern>
            <mask id="gd" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
              <image href="/brief/social-loop/letters/d.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" />
            </mask>
            <mask id="gl" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
              <image href="/brief/social-loop/letters/l.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" />
            </mask>
            <mask id="gn" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
              <image href="/brief/social-loop/letters/n.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" />
            </mask>
          </defs>
          <g class="mark-slot" transform="translate(67 80)">
            <g class="guest guest-d" transform="translate(4.63 0)">
              <rect width="57.5" height="67.35" fill="url(#hp)" mask="url(#gd)" stroke="none" />
            </g>
            <g class="guest guest-l" transform="translate(64.06 0)">
              <rect width="57.3" height="67.35" fill="url(#hp)" mask="url(#gl)" stroke="none" />
            </g>
            <g class="guest guest-n" transform="translate(123.49 0)">
              <rect width="57.88" height="67.35" fill="url(#hp)" mask="url(#gn)" stroke="none" />
            </g>
            <image class="mark" href="../../brand/dln-mute.png" width="186" height="67.35" />
          </g>
        </svg>
        <i class="base"></i>
      </article>

      <aside class="outs" aria-hidden>
        <div class="cell">
          <svg class="pack pack-bottle" viewBox="0 0 160 140" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
            <path class="skin" d="M52 44 L108 44 L118 54 V118 L100 134 H60 L42 118 V54 Z" />
            <path d="M64 12 H96 V24 L108 34 V44 H52 V34 L64 24 Z" />
            <path d="M52 44 L108 44 L118 54 V118 L100 134 H60 L42 118 V54 Z" />
            <path d="M42 62 H118" />
            <g class="stamp-slot" transform="translate(44 84)">
              <image class="stamp" href="../../brand/dln-white.png" width="72" height="26.06" />
            </g>
          </svg>
        </div>
        <div class="cell">
          <svg class="pack pack-tub" viewBox="0 0 160 140" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
            <path class="skin" d="M36 40 V96 L52 118 H108 L124 96 V40 Z" />
            <path d="M36 40 L52 28 H108 L124 40" />
            <path d="M36 40 V96 L52 118 H108 L124 96 V40" />
            <path d="M36 78 L52 92 H108 L124 78" />
            <g class="stamp-slot" transform="translate(44 58)">
              <image class="stamp" href="../../brand/dln-white.png" width="72" height="26.06" />
            </g>
          </svg>
        </div>
        <div class="cell">
          <svg class="pack pack-sleeve" viewBox="0 0 160 140" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
            <path class="skin" d="M48 38 L96 38 L114 56 L114 108 L96 126 L48 126 L30 108 L30 56 Z" />
            <path d="M48 38 L96 38 L114 56 L114 108 L96 126 L48 126 L30 108 L30 56 Z" />
            <path d="M48 38 L62 18 L110 18 L96 38" />
            <path d="M114 56 L130 42 L130 94 L114 108" />
            <path d="M96 38 L110 18 L130 42 L114 56" />
            <g class="stamp-slot" transform="translate(36 78)">
              <image class="stamp" href="../../brand/dln-white.png" width="72" height="26.06" />
            </g>
          </svg>
        </div>
      </aside>
    </div>

    <i class="ghost ghost-d"></i>
    <i class="ghost ghost-l"></i>
    <i class="ghost ghost-n"></i>
    <div class="flyer" id="flyer">
      <img src="../../brand/dln-mute.png" alt="" />
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    function paintGround() {
      let g = q.get("ground") || "";
      if (!g) {
        try {
          g = parent.document.documentElement.getAttribute("data-ground") || "";
        } catch (e) {}
      }
      const ink = g === "ink";
      document.documentElement.style.setProperty("--ground", ink ? "#000000" : "#ffffff");
      document.documentElement.style.setProperty("--ink", ink ? "#ffffff" : "#414141");
    }
    paintGround();
    try {
      const mo = new MutationObserver(paintGround);
      mo.observe(parent.document.documentElement, {
        attributes: true,
        attributeFilter: ["data-ground"],
      });
    } catch (e) {}
    const baked = document.documentElement.getAttribute("data-orient");
    const orient = q.get("orient") === "portrait" || (!q.has("orient") && baked === "portrait")
      ? "portrait" : "landscape";
    document.documentElement.dataset.orient = orient;
    const portrait = orient === "portrait";

    const stage = document.getElementById("stage");
    const board = document.getElementById("board");
    const win = document.getElementById("window");
    const hatches = [...stage.querySelectorAll(".hatch")];
    const guests = [...stage.querySelectorAll(".guest")];
    const ghosts = [...stage.querySelectorAll(".ghost")];
    const stampSlots = [...stage.querySelectorAll(".stamp-slot")];
    const skins = [...stage.querySelectorAll(".pack .skin")];
    const stamps = [...stage.querySelectorAll(".pack .stamp")];
    const mark = stage.querySelector(".mark");
    const markSlot = stage.querySelector(".mark-slot");
    const flyer = document.getElementById("flyer");

    const CYCLE = 16000;
    const ease = (p) => p * p * (3 - 2 * p);
    const clamp = (t, a, b) => (t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a));
    const eclamp = (t, a, b) => ease(clamp(t, a, b));
    const lerp = (a, b, p) => a + (b - a) * p;
    const PAN = portrait ? 34 : 38;

    function boxOf(el) {
      const s = stage.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      if (!r.width) return { x: 0, y: 0, w: 0, h: 0 };
      return {
        x: ((r.left + r.width / 2 - s.left) / s.width) * 100,
        y: ((r.top + r.height / 2 - s.top) / s.height) * 100,
        w: (r.width / s.width) * 100,
        h: (r.height / s.height) * 100,
      };
    }
    function mix(a, b, p) {
      return {
        x: lerp(a.x, b.x, p),
        y: lerp(a.y, b.y, p),
        w: lerp(a.w, b.w, p),
        h: lerp(a.h, b.h, p),
      };
    }
    function put(el, pos, opacity) {
      el.style.left = (pos.x - pos.w / 2) + "%";
      el.style.top = (pos.y - pos.h / 2) + "%";
      el.style.width = pos.w + "%";
      el.style.height = pos.h + "%";
      el.style.opacity = String(opacity);
    }
    function panBoard(p) {
      const v = PAN * (1 - p);
      board.style.transform = portrait ? `translateY(${v}%)` : `translateX(${v}%)`;
    }

    function frame(t) {
      const panIn = eclamp(t, 5600, 7400);
      const panOut = eclamp(t, 14200, 15800);
      const reset = panOut;
      panBoard(panIn * (1 - panOut));
      const zoom = lerp(1, 0.86, panIn * (1 - panOut));
      win.style.transform = "scale(" + zoom + ")";

      const from = hatches.map((h) => boxOf(h));
      const to = guests.map((g) => boxOf(g));
      const onto = stampSlots.map((g) => boxOf(g));
      const markBox = markSlot ? boxOf(markSlot) : to[1];

      for (let i = 0; i < 3; i += 1) {
        const t0 = 400 + i * 700;
        const t1 = t0 + 1200;
        const fly = eclamp(t, t0, t1);
        const pos = mix(from[i], to[i], fly);
        let o = 0;
        if (t >= t0 && t < t1) {
          o = t < t0 + 90 ? (t - t0) / 90 : 1;
        } else if (t >= t1 && t < t1 + 90) {
          o = 1 - (t - t1) / 90;
        }
        put(ghosts[i], pos, o);
      }

      hatches.forEach((h, i) => {
        const t0 = 400 + i * 700;
        let o = 1;
        if (t > t0) o = lerp(1, 0, eclamp(t, t0, t0 + 900));
        if (t >= 14200) o = lerp(0, 1, reset);
        h.style.opacity = String(o);
      });

      const landAt = [1600, 2300, 3000];
      guests.forEach((g, i) => {
        const arrived = clamp(t, landAt[i] - 80, landAt[i]);
        const fade = eclamp(t, 3400, 4600);
        g.style.opacity = String(arrived * (1 - fade) * (1 - reset));
      });

      const born = eclamp(t, 3600, 5000);
      const liftOff = eclamp(t, 7600, 8200);
      mark.style.opacity = String(born * (1 - liftOff) * (1 - reset));

      let fpos = markBox;
      let fop = 0;
      if (t >= 7600 && t < 8200) {
        fpos = markBox;
        fop = liftOff;
      } else if (t >= 8200 && t < 9400) {
        fpos = mix(markBox, onto[0], eclamp(t, 8200, 9400));
        fop = 1;
      } else if (t >= 9400 && t < 9800) {
        fpos = onto[0];
        fop = 1;
      } else if (t >= 9800 && t < 11000) {
        fpos = mix(onto[0], onto[1], eclamp(t, 9800, 11000));
        fop = 1;
      } else if (t >= 11000 && t < 11400) {
        fpos = onto[1];
        fop = 1;
      } else if (t >= 11400 && t < 12600) {
        fpos = mix(onto[1], onto[2], eclamp(t, 11400, 12600));
        fop = 1;
      } else if (t >= 12600 && t < 13400) {
        fpos = onto[2];
        fop = 1 - eclamp(t, 13000, 13400);
      }
      put(flyer, fpos, fop);

      const fadeSkin = 1 - reset;
      skins[0].style.opacity = String(eclamp(t, 9000, 9400) * fadeSkin);
      skins[1].style.opacity = String(eclamp(t, 10600, 11000) * fadeSkin);
      skins[2].style.opacity = String(eclamp(t, 12200, 12600) * fadeSkin);
      stamps[0].style.opacity = String(eclamp(t, 9200, 9600) * fadeSkin);
      stamps[1].style.opacity = String(eclamp(t, 10800, 11200) * fadeSkin);
      stamps[2].style.opacity = String(eclamp(t, 12400, 12800) * fadeSkin);
    }

    const beats = [
      { t: 0, name: "idle" },
      { t: 400, name: "go1" },
      { t: 1600, name: "in1" },
      { t: 1100, name: "go2" },
      { t: 2300, name: "in2" },
      { t: 1800, name: "go3" },
      { t: 3000, name: "in3" },
      { t: 4200, name: "mark" },
      { t: 6400, name: "pan" },
      { t: 7900, name: "lift" },
      { t: 8800, name: "fly1" },
      { t: 9400, name: "on1" },
      { t: 10400, name: "fly2" },
      { t: 11000, name: "on2" },
      { t: 12000, name: "fly3" },
      { t: 12800, name: "on3" },
      { t: 14200, name: "back" },
    ];
    const order = Object.fromEntries(beats.map((b) => [b.name, b.t]));
    function extras(name) {
      const t = order[name] ?? 0;
      const bits = [];
      if (t >= order.in1) bits.push("has-g1");
      if (t >= order.in2) bits.push("has-g2");
      if (t >= order.in3) bits.push("has-g3");
      if (t >= order.mark) bits.push("has-mark");
      if (t >= order.pan) bits.push("has-pan");
      if (t >= order.lift) bits.push("has-gone");
      if (t >= order.on1) bits.push("has-s1");
      if (t >= order.on2) bits.push("has-s2");
      if (t >= order.on3) bits.push("has-s3");
      return bits.join(" ");
    }
    function apply(b) {
      stage.className = "stage is-" + b.name + " " + extras(b.name);
    }

    const freeze = q.get("beat");
    const freezeT = q.get("t");
    if (freeze || freezeT != null) {
      const t = freezeT != null ? Number(freezeT) : (order[freeze] ?? 0);
      if (freeze) document.documentElement.dataset.freeze = "1";
      apply(beats.find((x) => x.name === (freeze || "idle")) || beats[0]);
      frame(t);
      requestAnimationFrame(() => frame(t));
    } else {
      stage.className = "stage is-live";
      const t0 = performance.now();
      function tickLoop(now) {
        frame((now - t0) % CYCLE);
        requestAnimationFrame(tickLoop);
      }
      requestAnimationFrame(tickLoop);
    }
  </script>
</body>
</html>
