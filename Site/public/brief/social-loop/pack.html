<!DOCTYPE html>
<html lang="en-GB" data-orient="landscape">
<head>
  <meta charset="utf-8" />
  <title>DLN loop — pack</title>
  <style>
    :root {
      --ground: #ffffff;
      --ink: #414141;
      --c1: #2c2c2c;
      --c2: #3d6b8a;
      --c3: #a0563a;
      --font: "aktiv-grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font);
      height: 100%;
      overflow: hidden;
    }
    body { display: flex; align-items: center; justify-content: center; }
    .stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      padding: 4.2% 4.6% 3.6%;
      position: relative;
      overflow: hidden;
    }
    html[data-orient="portrait"] .stage {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      padding: 6.5% 8% 6%;
    }
    .board {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: 0.5fr 1.08fr 1fr;
      gap: 3%;
      align-items: stretch;
      will-change: transform;
    }
    html[data-orient="portrait"] .board {
      grid-template-columns: 1fr;
      grid-template-rows: 0.42fr 0.78fr 1.12fr;
    }

    .user {
      height: 100%;
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      align-items: center;
    }
    html[data-orient="portrait"] .user {
      grid-template-rows: 1fr;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .slot {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .hatch {
      width: 52%;
      max-width: 4.6rem;
      overflow: visible;
    }
    html[data-orient="portrait"] .hatch { width: 58%; }
    .hatch .edge {
      fill: none;
      stroke-width: 2.4;
      stroke-dasharray: 3.2 5.2;
      stroke-linejoin: miter;
    }
    .hatch .pigment { fill: transparent; opacity: 0; }
    .hatch-tri .edge { stroke: var(--c3); }
    .hatch-sq .edge { stroke: var(--c2); }
    .hatch-oct .edge { stroke: var(--c1); }
    .hatch-tri .pigment { fill: var(--c3); }
    .hatch-sq .pigment { fill: var(--c2); }
    .hatch-oct .pigment { fill: var(--c1); }

    .tick {
      position: absolute;
      left: calc(50% + 2.15rem);
      width: 1.45rem;
      height: 1.45rem;
      opacity: 0;
      overflow: visible;
    }
    html[data-orient="portrait"] .tick {
      left: auto;
      right: 6%;
      top: 8%;
    }

    .window {
      width: 94%;
      margin: auto;
      color: var(--ink);
      align-self: center;
    }
    .lid { width: 100%; aspect-ratio: 16 / 10.6; display: block; overflow: visible; }
    .base {
      display: block;
      height: 0.78rem;
      background: var(--ink);
      clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%);
    }
    .guest { opacity: 1; }
    .guest .edge {
      fill: none;
      stroke-width: 2.5;
      stroke-dasharray: 3.2 5.2;
      opacity: 0;
    }
    .guest .pigment { fill: transparent; opacity: 0; }
    .guest-tri .edge { stroke: var(--c3); }
    .guest-sq .edge { stroke: var(--c2); }
    .guest-oct .edge { stroke: var(--c1); }
    .guest-tri .pigment { fill: var(--c3); }
    .guest-sq .pigment { fill: var(--c2); }
    .guest-oct .pigment { fill: var(--c1); }

    .ghost,
    .flyer {
      position: absolute;
      z-index: 6;
      pointer-events: none;
      overflow: visible;
      opacity: 0;
      left: 0;
      top: 0;
    }
    .ghost path.edge {
      fill: none;
      stroke-width: 2.4;
      stroke-dasharray: 3.2 5.2;
    }
    .ghost-tri path.edge { stroke: var(--c3); }
    .ghost-sq path.edge { stroke: var(--c2); }
    .ghost-oct path.edge { stroke: var(--c1); }
    .flyer path.pigment { fill: var(--c2); }
    .flyer path.edge { fill: none; stroke: var(--c2); stroke-width: 2.6; stroke-linejoin: miter; }

    .outs {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      min-width: 0;
    }
    html[data-orient="portrait"] .outs {
      grid-template-rows: 1fr;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .cell {
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pack {
      width: auto;
      height: 86%;
      max-width: 78%;
      overflow: visible;
      color: var(--ink);
    }
    .pack .skin { fill: var(--c2); stroke: none; opacity: 0; }
    .pack .stamp { display: none; }

    html[data-freeze] .ghost,
    html[data-freeze] .flyer { display: none; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <aside class="user" aria-hidden>
        <div class="slot">
          <svg class="hatch hatch-tri" viewBox="0 0 72 72">
            <path class="pigment" d="M36 8 L64 58 L54 66 L18 66 L8 58 Z" />
            <path class="edge" d="M36 8 L64 58 L54 66 L18 66 L8 58 Z" />
          </svg>
        </div>
        <div class="slot">
          <svg class="hatch hatch-sq" viewBox="0 0 72 72">
            <path class="pigment" d="M16 8 H56 L64 16 V56 L56 64 H16 L8 56 V16 Z" />
            <path class="edge" d="M16 8 H56 L64 16 V56 L56 64 H16 L8 56 V16 Z" />
          </svg>
          <svg class="tick" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="miter">
            <path d="M6 18 L14 26 L30 8" />
          </svg>
        </div>
        <div class="slot">
          <svg class="hatch hatch-oct" viewBox="0 0 72 72">
            <path class="pigment" d="M26 8 H46 L64 26 V46 L46 64 H26 L8 46 V26 Z" />
            <path class="edge" d="M26 8 H46 L64 26 V46 L46 64 H26 L8 46 V26 Z" />
          </svg>
        </div>
      </aside>

      <article class="window" aria-hidden>
        <svg class="lid" viewBox="0 0 320 214" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M14 0 H306 L320 14 V200 L306 214 H14 L0 200 V14 Z" />
          <path d="M0 28 H320" />
          <circle cx="16" cy="14" r="3.2" fill="currentColor" stroke="none" />
          <circle cx="28" cy="14" r="3.2" fill="currentColor" stroke="none" />
          <circle cx="40" cy="14" r="3.2" fill="currentColor" stroke="none" />
          <image href="../../brand/dln-mute.png" x="24" y="40" width="42" height="42" />
          <g class="guest guest-tri" transform="translate(78 88) scale(0.72)">
            <path class="pigment" d="M36 8 L64 58 L54 66 L18 66 L8 58 Z" />
            <path class="edge" d="M36 8 L64 58 L54 66 L18 66 L8 58 Z" />
          </g>
          <g class="guest guest-sq" transform="translate(150 88) scale(0.72)">
            <path class="pigment" d="M16 8 H56 L64 16 V56 L56 64 H16 L8 56 V16 Z" />
            <path class="edge" d="M16 8 H56 L64 16 V56 L56 64 H16 L8 56 V16 Z" />
          </g>
          <g class="guest guest-oct" transform="translate(222 88) scale(0.72)">
            <path class="pigment" d="M26 8 H46 L64 26 V46 L46 64 H26 L8 46 V26 Z" />
            <path class="edge" d="M26 8 H46 L64 26 V46 L46 64 H26 L8 46 V26 Z" />
          </g>
        </svg>
        <i class="base"></i>
      </article>

      <aside class="outs" aria-hidden>
        <div class="cell">
          <svg class="pack pack-bottle" viewBox="0 0 160 140" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
            <path class="skin" d="M52 44 L108 44 L118 54 V118 L100 134 H60 L42 118 V54 Z" />
            <path d="M64 12 H96 V24 L108 34 V44 H52 V34 L64 24 Z" />
            <path d="M52 44 L108 44 L118 54 V118 L100 134 H60 L42 118 V54 Z" />
            <path d="M42 62 H118" />
            <g class="stamp-slot" transform="translate(52 62) scale(0.3)">
              <rect width="72" height="72" fill="none" stroke="none" />
            </g>
          </svg>
        </div>
        <div class="cell">
          <svg class="pack pack-tub" viewBox="0 0 160 140" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
            <path class="skin" d="M36 40 V96 L52 118 H108 L124 96 V40 Z" />
            <path d="M36 40 L52 28 H108 L124 40" />
            <path d="M36 40 V96 L52 118 H108 L124 96 V40" />
            <path d="M36 78 L52 92 H108 L124 78" />
            <g class="stamp-slot" transform="translate(86 46) scale(0.36)">
              <rect width="72" height="72" fill="none" stroke="none" />
            </g>
          </svg>
        </div>
        <div class="cell">
          <svg class="pack pack-sleeve" viewBox="0 0 160 140" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
            <path class="skin" d="M48 38 L96 38 L114 56 L114 108 L96 126 L48 126 L30 108 L30 56 Z" />
            <path d="M48 38 L96 38 L114 56 L114 108 L96 126 L48 126 L30 108 L30 56 Z" />
            <path d="M48 38 L62 18 L110 18 L96 38" />
            <path d="M114 56 L130 42 L130 94 L114 108" />
            <path d="M96 38 L110 18 L130 42 L114 56" />
            <g class="stamp-slot" transform="translate(38 78) scale(0.44)">
              <rect width="72" height="72" fill="none" stroke="none" />
            </g>
          </svg>
        </div>
      </aside>
    </div>

    <svg class="ghost ghost-tri" viewBox="0 0 72 72">
      <path class="edge" d="M36 8 L64 58 L54 66 L18 66 L8 58 Z" />
    </svg>
    <svg class="ghost ghost-sq" viewBox="0 0 72 72">
      <path class="edge" d="M16 8 H56 L64 16 V56 L56 64 H16 L8 56 V16 Z" />
    </svg>
    <svg class="ghost ghost-oct" viewBox="0 0 72 72">
      <path class="edge" d="M26 8 H46 L64 26 V46 L46 64 H26 L8 46 V26 Z" />
    </svg>
    <svg class="flyer" viewBox="0 0 72 72">
      <path class="pigment" d="M16 8 H56 L64 16 V56 L56 64 H16 L8 56 V16 Z" />
      <path class="edge" d="M16 8 H56 L64 16 V56 L56 64 H16 L8 56 V16 Z" />
    </svg>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    function paintGround() {
      let g = q.get("ground") || "";
      if (!g) {
        try {
          g = parent.document.documentElement.getAttribute("data-ground") || "";
        } catch (e) {}
      }
      const ink = g === "ink";
      document.documentElement.style.setProperty("--ground", ink ? "#000000" : "#ffffff");
      document.documentElement.style.setProperty("--ink", ink ? "#ffffff" : "#414141");
    }
    paintGround();
    try {
      const mo = new MutationObserver(paintGround);
      mo.observe(parent.document.documentElement, {
        attributes: true,
        attributeFilter: ["data-ground"],
      });
    } catch (e) {}
    const baked = document.documentElement.getAttribute("data-orient");
    const orient = q.get("orient") === "portrait" || (!q.has("orient") && baked === "portrait")
      ? "portrait" : "landscape";
    document.documentElement.dataset.orient = orient;
    const portrait = orient === "portrait";

    const stage = document.getElementById("stage");
    const board = document.getElementById("board");
    const hatches = [...stage.querySelectorAll(".hatch")];
    const guests = [...stage.querySelectorAll(".guest")];
    const ghosts = [...stage.querySelectorAll(".ghost")];
    const stampSlots = [...stage.querySelectorAll(".stamp-slot")];
    const skins = [...stage.querySelectorAll(".pack .skin")];
    const flyer = stage.querySelector(".flyer");
    const tick = stage.querySelector(".tick");
    const hatchPigment = hatches.map((h) => h.querySelector(".pigment"));
    const hatchEdge = hatches.map((h) => h.querySelector(".edge"));
    const guestPigment = guests.map((g) => g.querySelector(".pigment"));
    const guestEdge = guests.map((g) => g.querySelector(".edge"));

    const PICK = 1;
    const CYCLE = 16000;
    const ease = (p) => p * p * (3 - 2 * p);
    const clamp = (t, a, b) => (t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a));
    const eclamp = (t, a, b) => ease(clamp(t, a, b));
    const lerp = (a, b, p) => a + (b - a) * p;
    const PAN = portrait ? 34 : 38;

    function viewBoxScreen(el, vb) {
      const s = stage.getBoundingClientRect();
      const ctm = el.getScreenCTM();
      if (!ctm) return { x: 0, y: 0, w: 0, h: 0 };
      const a = new DOMPoint(0, 0).matrixTransform(ctm);
      const b = new DOMPoint(vb, 0).matrixTransform(ctm);
      const c = new DOMPoint(0, vb).matrixTransform(ctm);
      const m = new DOMPoint(vb / 2, vb / 2).matrixTransform(ctm);
      return {
        x: ((m.x - s.left) / s.width) * 100,
        y: ((m.y - s.top) / s.height) * 100,
        w: (Math.hypot(b.x - a.x, b.y - a.y) / s.width) * 100,
        h: (Math.hypot(c.x - a.x, c.y - a.y) / s.height) * 100,
      };
    }
    function mix(a, b, p) {
      return {
        x: lerp(a.x, b.x, p),
        y: lerp(a.y, b.y, p),
        w: lerp(a.w, b.w, p),
        h: lerp(a.h, b.h, p),
      };
    }
    function put(el, pos, opacity) {
      el.style.left = (pos.x - pos.w / 2) + "%";
      el.style.top = (pos.y - pos.h / 2) + "%";
      el.style.width = pos.w + "%";
      el.style.height = pos.h + "%";
      el.style.opacity = String(opacity);
    }
    function panBoard(p) {
      const v = PAN * (1 - p);
      board.style.transform = portrait ? `translateY(${v}%)` : `translateX(${v}%)`;
    }

    function frame(t) {
      const panIn = eclamp(t, 5200, 6800);
      const panOut = eclamp(t, 13600, 15600);
      const reset = panOut;
      panBoard(panIn * (1 - panOut));

      const from = hatches.map((h) => viewBoxScreen(h, 72));
      const to = guests.map((g) => viewBoxScreen(g, 72));
      const onto = stampSlots.map((g) => viewBoxScreen(g, 72));

      for (let i = 0; i < 3; i += 1) {
        const t0 = 350 + i * 800;
        const t1 = t0 + 1100;
        const fly = eclamp(t, t0, t1);
        const pos = mix(from[i], to[i], fly);
        let o = 0;
        if (t >= t0 && t < t1) {
          o = t < t0 + 90 ? (t - t0) / 90 : 1;
        } else if (t >= t1 && t < t1 + 90) {
          o = 1 - (t - t1) / 90;
        }
        put(ghosts[i], pos, o);
      }

      const ink = eclamp(t, 3300, 4300);

      hatches.forEach((h, i) => {
        const t0 = 350 + i * 800;
        const t1 = t0 + 1100;
        let o = 1;
        if (t > t0 && t < 3300) o = 0.34;
        if (t >= 3300) o = 1;
        if (i !== PICK && t >= 4300) o = lerp(1, 0.32, eclamp(t, 4300, 4900));
        if (t >= 13600) o = lerp(i !== PICK ? 0.32 : 1, 1, reset);
        h.style.opacity = String(o);
      });

      tick.style.opacity = String(eclamp(t, 4300, 4900) * (1 - reset));

      const leave = eclamp(t, 5000, 6000);
      const liftOff = eclamp(t, 7000, 7600);
      const landAt = [1450, 2250, 3050];
      guests.forEach((g, i) => {
        const arrived = clamp(t, landAt[i] - 80, landAt[i]);
        let show = arrived;
        if (i === PICK) show *= (1 - liftOff);
        else show *= (1 - leave);
        show *= (1 - reset);
        guestEdge[i].style.opacity = String(show * (1 - ink));
        guestPigment[i].style.opacity = String(show * ink);
      });
      const inkNow = ink * (1 - reset);
      hatchPigment.forEach((p) => { p.style.opacity = String(inkNow); });
      hatchEdge.forEach((p) => { p.style.opacity = String(1 - inkNow); });

      let fpos = to[PICK];
      let fop = 0;
      if (t >= 7000 && t < 7600) {
        fpos = to[PICK];
        fop = liftOff;
      } else if (t >= 7600 && t < 9000) {
        fpos = mix(to[PICK], onto[0], eclamp(t, 7600, 9000));
        fop = 1;
      } else if (t >= 9000 && t < 9400) {
        fpos = onto[0];
        fop = 1;
      } else if (t >= 9400 && t < 10600) {
        fpos = mix(onto[0], onto[1], eclamp(t, 9400, 10600));
        fop = 1;
      } else if (t >= 10600 && t < 11000) {
        fpos = onto[1];
        fop = 1;
      } else if (t >= 11000 && t < 12200) {
        fpos = mix(onto[1], onto[2], eclamp(t, 11000, 12200));
        fop = 1;
      } else if (t >= 12200 && t < 12800) {
        fpos = onto[2];
        fop = 1 - eclamp(t, 12400, 12800);
      }
      put(flyer, fpos, fop);

      const fadeSkin = 1 - reset;
      skins[0].style.opacity = String(eclamp(t, 8600, 9000) * fadeSkin);
      skins[1].style.opacity = String(eclamp(t, 10200, 10600) * fadeSkin);
      skins[2].style.opacity = String(eclamp(t, 11800, 12200) * fadeSkin);
    }

    const beats = [
      { t: 0, name: "idle" },
      { t: 350, name: "go1" },
      { t: 1450, name: "in1" },
      { t: 1150, name: "go2" },
      { t: 2250, name: "in2" },
      { t: 1950, name: "go3" },
      { t: 3050, name: "in3" },
      { t: 3800, name: "ink" },
      { t: 4600, name: "pick" },
      { t: 5400, name: "leave" },
      { t: 6200, name: "pan" },
      { t: 7300, name: "lift" },
      { t: 8200, name: "fly1" },
      { t: 9000, name: "on1" },
      { t: 10000, name: "fly2" },
      { t: 10600, name: "on2" },
      { t: 11600, name: "fly3" },
      { t: 12200, name: "on3" },
      { t: 13600, name: "back" },
    ];
    const order = Object.fromEntries(beats.map((b) => [b.name, b.t]));
    function extras(name) {
      const t = order[name] ?? 0;
      const bits = [];
      if (t >= order.in1) bits.push("has-g1");
      if (t >= order.in2) bits.push("has-g2");
      if (t >= order.in3) bits.push("has-g3");
      if (t >= order.ink) bits.push("has-ink");
      if (t >= order.pick) bits.push("has-pick");
      if (t >= order.leave) bits.push("has-leave");
      if (t >= order.lift) bits.push("has-gone");
      if (t >= order.pan) bits.push("has-pan");
      if (t >= order.on1) bits.push("has-s1");
      if (t >= order.on2) bits.push("has-s2");
      if (t >= order.on3) bits.push("has-s3");
      return bits.join(" ");
    }
    function apply(b) {
      stage.className = "stage is-" + b.name + " " + extras(b.name);
    }

    const freeze = q.get("beat");
    const freezeT = q.get("t");
    if (freeze || freezeT != null) {
      const t = freezeT != null ? Number(freezeT) : (order[freeze] ?? 0);
      if (freeze) document.documentElement.dataset.freeze = "1";
      apply(beats.find((x) => x.name === (freeze || "idle")) || beats[0]);
      frame(t);
      requestAnimationFrame(() => frame(t));
    } else {
      stage.className = "stage is-live";
      const t0 = performance.now();
      function tickLoop(now) {
        frame((now - t0) % CYCLE);
        requestAnimationFrame(tickLoop);
      }
      requestAnimationFrame(tickLoop);
    }
  </script>
</body>
</html>
