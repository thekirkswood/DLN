<!DOCTYPE html>
<html lang="en-GB" data-orient="landscape">
<head>
  <meta charset="utf-8" />
  <title>DLN loop — UI</title>
  <style>
    :root {
      --ground: #ffffff;
      --ink: #414141;
      --font: "aktiv-grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font);
      height: 100%;
      overflow: hidden;
    }
    body { display: flex; align-items: center; justify-content: center; }
    .stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      position: relative;
      overflow: hidden;
    }
    html[data-orient="portrait"] .stage {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
    }
    .shell {
      position: absolute;
      background: var(--ink);
      z-index: 4;
    }
    .paper {
      position: absolute;
      inset: 2.4px;
      background: var(--ground);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .chrome {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.42rem 0.62rem;
      border-bottom: 1.6px solid var(--ink);
      min-height: 1.15rem;
      position: relative;
      overflow: hidden;
      background: var(--ground);
      z-index: 2;
    }
    .dot {
      width: 0.42rem;
      height: 0.42rem;
      background: var(--ink);
      flex: 0 0 auto;
    }
    .notch {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2.2rem;
      height: 0.28rem;
      background: var(--ink);
      transform: translate(-50%, -50%);
      opacity: 0;
    }
    .glass { position: relative; min-height: 0; overflow: hidden; }
    .shot { position: absolute; inset: 0; }
    .shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 62% 48%;
      display: block;
    }
    .sys {
      position: absolute;
      inset: 0;
      z-index: 2;
    }
    .mark {
      position: absolute;
      left: 50%;
      top: 8%;
      width: 22%;
      transform: translateX(-50%);
      display: block;
      height: auto;
      pointer-events: none;
    }
    .acts {
      position: absolute;
      left: 6.5%;
      right: 6.5%;
      bottom: 8%;
      height: 28%;
    }
    .btn {
      position: absolute;
      display: block;
      background: color-mix(in srgb, #fff 78%, transparent);
    }
    .base, .deck {
      position: absolute;
      pointer-events: none;
      z-index: 3;
    }
    .base {
      background: var(--ink);
      clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
    }
    .deck { overflow: visible; color: var(--ink); }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <i class="base" id="base"></i>
    <svg class="deck" id="deck" viewBox="0 0 200 72" preserveAspectRatio="none" aria-hidden>
      <path d="M24 2 H176 L196 58 L186 70 H14 L4 58 Z" fill="#fff" stroke="currentColor" stroke-width="3" stroke-linejoin="miter" />
    </svg>
    <div class="shell" id="shell">
      <div class="paper">
        <div class="chrome" id="chrome">
          <i class="dot" id="d1"></i>
          <i class="dot" id="d2"></i>
          <i class="dot" id="d3"></i>
          <i class="notch" id="notch"></i>
        </div>
        <div class="glass">
          <div class="shot">
            <img src="/brief/Portfolio/ui-shot.png" alt="" />
          </div>
          <div class="sys" id="sys">
            <img class="mark" id="mark" src="/brand/dln-white.png" alt="" />
            <div class="acts" id="acts">
              <i class="btn" id="b1"></i>
              <i class="btn" id="b2"></i>
              <i class="btn" id="b3"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const baked = document.documentElement.getAttribute("data-orient");
    const orient = q.get("orient") === "portrait" || (!q.has("orient") && baked === "portrait")
      ? "portrait" : "landscape";
    document.documentElement.dataset.orient = orient;
    const portrait = orient === "portrait";

    const stage = document.getElementById("stage");
    const shell = document.getElementById("shell");
    const base = document.getElementById("base");
    const deck = document.getElementById("deck");
    const chrome = document.getElementById("chrome");
    const dots = [document.getElementById("d1"), document.getElementById("d2"), document.getElementById("d3")];
    const notch = document.getElementById("notch");
    const mark = document.getElementById("mark");
    const btns = [document.getElementById("b1"), document.getElementById("b2"), document.getElementById("b3")];

    const CYCLE = 16000;
    const ease = (p) => p * p * (3 - 2 * p);
    const clamp = (t, a, b) => (t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a));
    const eclamp = (t, a, b) => ease(clamp(t, a, b));
    const lerp = (a, b, p) => a + (b - a) * p;
    function mixKeys(a, b, p) {
      const o = {};
      Object.keys(a).forEach((k) => { o[k] = lerp(a[k], b[k], p); });
      return o;
    }

    const L = {
      screen: { x: 50, y: 43, w: 48, h: 40, cut: 2.0, chrome: 1, dots: 1, notch: 0, base: 1, deck: 0, mark: 22, stack: 0 },
      laptop: { x: 50, y: 38, w: 42, h: 32, cut: 1.8, chrome: 1, dots: 1, notch: 0, base: 0, deck: 1, mark: 24, stack: 0 },
      phone:  { x: 50, y: 48, w: 15.5, h: 58, cut: 2.6, chrome: 1, dots: 0, notch: 1, base: 0, deck: 0, mark: 42, stack: 1 },
    };
    const P = {
      screen: { x: 50, y: 40, w: 78, h: 32, cut: 1.5, chrome: 1, dots: 1, notch: 0, base: 1, deck: 0, mark: 18, stack: 0 },
      laptop: { x: 50, y: 38, w: 72, h: 26, cut: 1.3, chrome: 1, dots: 1, notch: 0, base: 0, deck: 1, mark: 20, stack: 0 },
      phone:  { x: 50, y: 48, w: 42, h: 46, cut: 2.2, chrome: 1, dots: 0, notch: 1, base: 0, deck: 0, mark: 32, stack: 1 },
    };
    const set = portrait ? P : L;
    const row = [
      { x: 0, y: 52, w: 46, h: 38, cut: 6 },
      { x: 50, y: 58, w: 28, h: 30, cut: 5 },
      { x: 82, y: 52, w: 18, h: 38, cut: 5 },
    ];
    const col = [
      { x: 0, y: 6, w: 100, h: 28, cut: 7 },
      { x: 0, y: 40, w: 72, h: 24, cut: 6 },
      { x: 0, y: 70, w: 28, h: 26, cut: 6 },
    ];

    const keys = [
      { a: 0, b: 1800, from: set.screen, to: set.screen },
      { a: 1800, b: 3800, from: set.screen, to: set.laptop },
      { a: 3800, b: 5400, from: set.laptop, to: set.laptop },
      { a: 5400, b: 7400, from: set.laptop, to: set.phone },
      { a: 7400, b: 10200, from: set.phone, to: set.phone },
      { a: 10200, b: 13600, from: set.phone, to: set.screen },
      { a: 13600, b: 16000, from: set.screen, to: set.screen },
    ];

    function poseAt(t) {
      for (let i = 0; i < keys.length; i += 1) {
        const k = keys[i];
        if (t <= k.b || i === keys.length - 1) return mixKeys(k.from, k.to, eclamp(t, k.a, k.b));
      }
      return set.screen;
    }
    function chamfer(cut) {
      const c = cut + "%";
      return `polygon(${c} 0, calc(100% - ${c}) 0, 100% ${c}, 100% calc(100% - ${c}), calc(100% - ${c}) 100%, ${c} 100%, 0 calc(100% - ${c}), 0 ${c})`;
    }
    function btnCut(px) {
      const c = Math.max(3.2, px) + "px";
      return `polygon(${c} 0, calc(100% - ${c}) 0, 100% ${c}, 100% calc(100% - ${c}), calc(100% - ${c}) 100%, ${c} 100%, 0 calc(100% - ${c}), 0 ${c})`;
    }
    function morphBox(a, b, u, i) {
      if (u <= 0) return { ...a };
      if (u >= 1) return { ...b };
      const minS = 0.36;
      const shrinkT = 0.2;
      const growT = 0.8;
      const travel = [[0.52, 0.76], [0.36, 0.6], [0.22, 0.46]][i];
      let scale = minS;
      let t = 0;
      if (u < shrinkT) {
        scale = lerp(1, minS, ease(u / shrinkT));
        t = 0;
      } else if (u > growT) {
        scale = lerp(minS, 1, ease((u - growT) / (1 - growT)));
        t = 1;
      } else {
        t = ease(clamp(u, travel[0], travel[1]));
      }
      const box = mixKeys(a, b, t);
      const cx = box.x + box.w / 2;
      const cy = box.y + box.h / 2;
      const w = box.w * scale;
      const h = box.h * scale;
      return { x: cx - w / 2, y: cy - h / 2, w, h, cut: box.cut };
    }
    function putBtn(el, o) {
      el.style.left = o.x + "%";
      el.style.top = o.y + "%";
      el.style.width = o.w + "%";
      el.style.height = o.h + "%";
      el.style.clipPath = btnCut(o.cut);
    }

    function frame(t) {
      const p = poseAt(t);
      const left = p.x - p.w / 2;
      const top = p.y - p.h / 2;
      shell.style.left = left + "%";
      shell.style.top = top + "%";
      shell.style.width = p.w + "%";
      shell.style.height = p.h + "%";
      shell.style.clipPath = chamfer(p.cut);

      chrome.style.justifyContent = p.notch > 0.55 ? "center" : "flex-start";
      chrome.style.maxHeight = (2.35 * p.chrome) + "rem";
      chrome.style.minHeight = (1.15 * p.chrome) + "rem";
      chrome.style.paddingTop = (0.42 * p.chrome) + "rem";
      chrome.style.paddingBottom = (0.42 * p.chrome) + "rem";
      chrome.style.borderBottomWidth = (1.6 * p.chrome * (1 - p.notch)) + "px";
      chrome.style.opacity = String(p.chrome);
      dots[0].style.opacity = String(p.dots);
      dots[2].style.opacity = String(p.dots);
      dots[1].style.opacity = String(Math.max(p.dots, p.notch * 0.2));
      dots[1].style.width = lerp(0.42, 0.08, p.notch) + "rem";
      notch.style.opacity = String(p.notch);

      base.style.left = (left + p.w * 0.18) + "%";
      base.style.width = (p.w * 0.64) + "%";
      base.style.top = (top + p.h) + "%";
      base.style.height = "0.72rem";
      base.style.opacity = String(p.base);

      deck.style.left = (left - p.w * 0.05) + "%";
      deck.style.width = (p.w * 1.1) + "%";
      deck.style.top = (top + p.h - 0.12) + "%";
      deck.style.height = Math.max(p.h * 0.52, 8) + "%";
      deck.style.opacity = String(p.deck);

      mark.style.width = p.mark + "%";
      btns.forEach((b, i) => putBtn(b, morphBox(row[i], col[i], p.stack, i)));
    }

    const beats = [
      { t: 0, name: "screen" },
      { t: 2600, name: "tolaptop" },
      { t: 4600, name: "laptop" },
      { t: 6400, name: "tophone" },
      { t: 8800, name: "phone" },
      { t: 11800, name: "back" },
    ];
    const order = Object.fromEntries(beats.map((b) => [b.name, b.t]));
    const freeze = q.get("beat");
    const freezeT = q.get("t");
    if (freeze || freezeT != null) {
      const t = freezeT != null ? Number(freezeT) : (order[freeze] ?? 0);
      stage.className = "stage is-" + (freeze || "live");
      frame(t);
      requestAnimationFrame(() => frame(t));
    } else {
      stage.className = "stage is-live";
      const t0 = performance.now();
      function tickLoop(now) {
        frame((now - t0) % CYCLE);
        requestAnimationFrame(tickLoop);
      }
      requestAnimationFrame(tickLoop);
    }
  </script>
</body>
</html>
