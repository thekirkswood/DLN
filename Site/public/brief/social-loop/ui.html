<!DOCTYPE html>
<html lang="en-GB" data-orient="landscape">
<head>
  <meta charset="utf-8" />
  <title>DLN loop — UI</title>
  <style>
    :root {
      --ground: #ffffff;
      --ink: #414141;
      --mute: #6e6e6e;
      --line: #d4d4d4;
      --bar: #d8d8d8;
      --font: "aktiv-grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font);
      height: 100%;
      overflow: hidden;
    }
    body { display: flex; align-items: center; justify-content: center; }
    .stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      position: relative;
      overflow: hidden;
    }
    html[data-orient="portrait"] .stage {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
    }

    .shell {
      position: absolute;
      background: var(--ink);
      z-index: 4;
    }
    .paper {
      position: absolute;
      inset: 2.4px;
      background: var(--ground);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .chrome {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.42rem 0.62rem;
      border-bottom: 1.6px solid var(--ink);
      min-height: 1.15rem;
      position: relative;
      overflow: hidden;
    }
    .dot {
      width: 0.42rem;
      height: 0.42rem;
      background: var(--ink);
      flex: 0 0 auto;
    }
    .notch {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2.2rem;
      height: 0.28rem;
      background: var(--ink);
      transform: translate(-50%, -50%);
      opacity: 0;
    }
    .glass {
      padding: 0.7rem 0.85rem 0.8rem;
      display: grid;
      align-content: start;
      gap: 0.48rem;
      min-height: 0;
    }
    .glass img {
      width: 2.1rem;
      height: auto;
      display: block;
    }
    .glass b {
      display: block;
      height: 0.42rem;
      background: var(--bar);
    }
    .glass b:nth-of-type(2) { width: 58%; }
    .glass em {
      display: block;
      height: 48%;
      min-height: 4.6rem;
      background: #ececec;
      font-style: normal;
      clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    }

    .posts, .base, .deck {
      position: absolute;
      pointer-events: none;
      z-index: 3;
    }
    .posts {
      display: flex;
      justify-content: space-between;
      padding: 0 12%;
    }
    .posts i {
      width: 0.42rem;
      height: 100%;
      background: var(--ink);
    }
    .base {
      background: var(--ink);
      clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
    }
    .deck {
      overflow: visible;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="posts" id="posts" aria-hidden><i></i><i></i></div>
    <i class="base" id="base"></i>
    <svg class="deck" id="deck" viewBox="0 0 200 72" preserveAspectRatio="none" aria-hidden>
      <path d="M24 2 H176 L196 58 L186 70 H14 L4 58 Z" fill="#fff" stroke="currentColor" stroke-width="3" stroke-linejoin="miter" />
    </svg>
    <div class="shell" id="shell">
      <div class="paper">
        <div class="chrome" id="chrome">
          <i class="dot" id="d1"></i>
          <i class="dot" id="d2"></i>
          <i class="dot" id="d3"></i>
          <i class="notch" id="notch"></i>
        </div>
        <div class="glass">
          <img src="../../brand/dln-mute.png" alt="" />
          <b></b>
          <b></b>
          <em></em>
        </div>
      </div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const baked = document.documentElement.getAttribute("data-orient");
    const orient = q.get("orient") === "portrait" || (!q.has("orient") && baked === "portrait")
      ? "portrait" : "landscape";
    document.documentElement.dataset.orient = orient;
    const portrait = orient === "portrait";

    const stage = document.getElementById("stage");
    const shell = document.getElementById("shell");
    const posts = document.getElementById("posts");
    const base = document.getElementById("base");
    const deck = document.getElementById("deck");
    const chrome = document.getElementById("chrome");
    const dots = [document.getElementById("d1"), document.getElementById("d2"), document.getElementById("d3")];
    const notch = document.getElementById("notch");

    const CYCLE = 16000;
    const ease = (p) => p * p * (3 - 2 * p);
    const clamp = (t, a, b) => (t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a));
    const eclamp = (t, a, b) => ease(clamp(t, a, b));
    const lerp = (a, b, p) => a + (b - a) * p;

    const L = {
      wall:   { x: 50, y: 44, w: 74, h: 36, cut: 2.2, chrome: 0, dots: 0, notch: 0, posts: 1, base: 0, deck: 0 },
      screen: { x: 50, y: 43, w: 48, h: 40, cut: 2.0, chrome: 1, dots: 1, notch: 0, posts: 0, base: 1, deck: 0 },
      laptop: { x: 50, y: 38, w: 42, h: 32, cut: 1.8, chrome: 1, dots: 1, notch: 0, posts: 0, base: 0, deck: 1 },
      phone:  { x: 50, y: 48, w: 15.5, h: 58, cut: 2.6, chrome: 1, dots: 0, notch: 1, posts: 0, base: 0, deck: 0 },
    };
    const P = {
      wall:   { x: 50, y: 38, w: 86, h: 26, cut: 1.2, chrome: 0, dots: 0, notch: 0, posts: 1, base: 0, deck: 0 },
      screen: { x: 50, y: 40, w: 78, h: 32, cut: 1.5, chrome: 1, dots: 1, notch: 0, posts: 0, base: 1, deck: 0 },
      laptop: { x: 50, y: 38, w: 72, h: 26, cut: 1.3, chrome: 1, dots: 1, notch: 0, posts: 0, base: 0, deck: 1 },
      phone:  { x: 50, y: 48, w: 42, h: 46, cut: 2.2, chrome: 1, dots: 0, notch: 1, posts: 0, base: 0, deck: 0 },
    };
    const set = portrait ? P : L;

    const keys = [
      { a: 0, b: 1600, from: set.wall, to: set.wall },
      { a: 1600, b: 3400, from: set.wall, to: set.screen },
      { a: 3400, b: 5000, from: set.screen, to: set.screen },
      { a: 5000, b: 6800, from: set.screen, to: set.laptop },
      { a: 6800, b: 8200, from: set.laptop, to: set.laptop },
      { a: 8200, b: 10000, from: set.laptop, to: set.phone },
      { a: 10000, b: 11800, from: set.phone, to: set.phone },
      { a: 11800, b: 14800, from: set.phone, to: set.wall },
      { a: 14800, b: 16000, from: set.wall, to: set.wall },
    ];

    function mixPose(a, b, p) {
      const o = {};
      Object.keys(a).forEach((k) => { o[k] = lerp(a[k], b[k], p); });
      return o;
    }
    function poseAt(t) {
      for (let i = 0; i < keys.length; i += 1) {
        const k = keys[i];
        if (t <= k.b || i === keys.length - 1) return mixPose(k.from, k.to, eclamp(t, k.a, k.b));
      }
      return set.wall;
    }
    function chamfer(cut) {
      const c = cut + "%";
      return `polygon(${c} 0, calc(100% - ${c}) 0, 100% ${c}, 100% calc(100% - ${c}), calc(100% - ${c}) 100%, ${c} 100%, 0 calc(100% - ${c}), 0 ${c})`;
    }

    function frame(t) {
      const p = poseAt(t);
      const left = p.x - p.w / 2;
      const top = p.y - p.h / 2;
      shell.style.left = left + "%";
      shell.style.top = top + "%";
      shell.style.width = p.w + "%";
      shell.style.height = p.h + "%";
      shell.style.clipPath = chamfer(p.cut);

      chrome.style.justifyContent = p.notch > 0.55 ? "center" : "flex-start";
      chrome.style.maxHeight = (2.35 * p.chrome) + "rem";
      chrome.style.minHeight = (1.15 * p.chrome) + "rem";
      chrome.style.paddingTop = (0.42 * p.chrome) + "rem";
      chrome.style.paddingBottom = (0.42 * p.chrome) + "rem";
      chrome.style.borderBottomWidth = (1.6 * p.chrome * (1 - p.notch)) + "px";
      chrome.style.opacity = String(p.chrome);
      dots[0].style.opacity = String(p.dots);
      dots[2].style.opacity = String(p.dots);
      dots[1].style.opacity = String(Math.max(p.dots, p.notch * 0.2));
      dots[1].style.width = lerp(0.42, 0.08, p.notch) + "rem";
      notch.style.opacity = String(p.notch);

      posts.style.left = (left + p.w * 0.08) + "%";
      posts.style.width = (p.w * 0.84) + "%";
      posts.style.top = (top + p.h) + "%";
      posts.style.height = (p.h * 0.28) + "%";
      posts.style.opacity = String(p.posts);

      base.style.left = (left + p.w * 0.18) + "%";
      base.style.width = (p.w * 0.64) + "%";
      base.style.top = (top + p.h) + "%";
      base.style.height = "0.72rem";
      base.style.opacity = String(p.base);

      deck.style.left = (left - p.w * 0.05) + "%";
      deck.style.width = (p.w * 1.1) + "%";
      deck.style.top = (top + p.h - 0.12) + "%";
      deck.style.height = Math.max(p.h * 0.52, 8) + "%";
      deck.style.opacity = String(p.deck);
    }

    const beats = [
      { t: 0, name: "wall" },
      { t: 2500, name: "toscreen" },
      { t: 4200, name: "screen" },
      { t: 5900, name: "tolaptop" },
      { t: 7500, name: "laptop" },
      { t: 9100, name: "tophone" },
      { t: 10900, name: "phone" },
      { t: 13200, name: "back" },
    ];
    const order = Object.fromEntries(beats.map((b) => [b.name, b.t]));

    const freeze = q.get("beat");
    const freezeT = q.get("t");
    if (freeze || freezeT != null) {
      const t = freezeT != null ? Number(freezeT) : (order[freeze] ?? 0);
      stage.className = "stage is-" + (freeze || "live");
      frame(t);
      requestAnimationFrame(() => frame(t));
    } else {
      stage.className = "stage is-live";
      const t0 = performance.now();
      function tickLoop(now) {
        frame((now - t0) % CYCLE);
        requestAnimationFrame(tickLoop);
      }
      requestAnimationFrame(tickLoop);
    }
  </script>
</body>
</html>
